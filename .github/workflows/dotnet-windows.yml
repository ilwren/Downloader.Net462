name: Windows x64

on: [ push ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  build:
    runs-on: windows-latest
    environment: Windows
    strategy:
      matrix:
        dotnet-version: [ 10.0.x ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Setup .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build solution
        run: dotnet build -c Release ./src --verbosity minimal 

      - name: Run tests
        timeout-minutes: 25
        run: dotnet test -c Release ./src --verbosity normal --no-build --no-restore

      # The Downloader library also targets net462/netstandard2.0 (compiled on every OS leg via
      # Microsoft.NETFramework.ReferenceAssemblies). Windows is the only leg that can also *run*
      # the .NET Framework artifact: the smoke test verifies the net462 HTTP path
      # (HttpClientHandler/ServicePoint) end-to-end against its in-process TCP-based server.
      - name: Run net462 smoke test (.NET Framework)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path ./src/Downloader.Net462SmokeTest/bin/Release/net462 -Filter Downloader.Net462SmokeTest.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "net462 smoke test exe not found" }
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { throw "net462 smoke test failed with exit code $LASTEXITCODE" }